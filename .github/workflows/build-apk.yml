name: APK bauen – Print Home App News Design

on:
  push:
    branches: [main]
    paths:
      - 'print-home-app-news-design/**'
      - 'apk/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Capacitor-Projekt anlegen
        run: |
          mkdir -p build/www
          cp print-home-app-news-design/index.html print-home-app-news-design/app.js build/www/
          cd build
          cat > package.json <<'JSON'
          { "name": "print-home-news-design", "version": "1.0.0", "private": true }
          JSON
          npm install --no-audit --no-fund @capacitor/core@6.2.0 @capacitor/cli@6.2.0 @capacitor/android@6.2.0
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "at.printhome.newsdesign",
            "appName": "Print Home",
            "webDir": "www",
            "backgroundColor": "#17232F",
            "android": { "backgroundColor": "#17232F" }
          }
          JSON
          npx cap add android
          npx cap sync android

      - name: App-Icon (PH-Monogramm) einsetzen
        run: |
          cp -r apk/res/* build/android/app/src/main/res/
          f=build/android/app/src/main/res/values/ic_launcher_background.xml
          if [ -f "$f" ]; then sed -i 's/#[0-9A-Fa-f]\{6\}/#17232F/' "$f"; fi

      - name: APK bauen
        working-directory: build/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../../PrintHome-NewsDesign.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PrintHome-NewsDesign-APK
          path: PrintHome-NewsDesign.apk

      - name: Als Download (Release) veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: news-design-build-${{ github.run_number }}
          name: Print Home App News Design – Test-APK ${{ github.run_number }}
          body: |
            Test-APK der Print Home App im Nordic-Design (Demo-Modus, Checkout noch inaktiv).
            Installation: APK am Android-Handy öffnen und „Unbekannte Apps installieren“ für den Browser erlauben.
          files: PrintHome-NewsDesign.apk
          prerelease: true
