name: Live-Update veröffentlichen

on:
  push:
    branches: [main]
    paths:
      - 'live/**'
      - '.github/workflows/publish-live.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Versionsanzeige im Bundle prüfen
        run: |
          V=$(python3 -c 'import json;print(json.load(open("live/latest.json"))["version"])')
          unzip -p live/bundle.zip 'assets/index-*.js' | grep -q "ug=\"1.5.$V\"" || { echo "Versionsanzeige im Bundle passt nicht zu latest.json ($V)"; exit 1; }

      - name: Version aus latest.json lesen
        id: v
        run: echo "version=$(python3 -c 'import json;print(json.load(open("live/latest.json"))["version"])')" >> "$GITHUB_OUTPUT"

      - name: Release build-N anlegen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ steps.v.outputs.version }}
          name: Build ${{ steps.v.outputs.version }}
          body: Live-Update der Print Home App
          files: |
            live/bundle.zip
            live/latest.json
          make_latest: true

  apk:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: APK aus Basis-APK und Live-Bundle bauen
        run: |
          mkdir -p stage/assets/public
          unzip -q live/bundle.zip -d stage/assets/public
          cp live/base/PrintHome-base.apk work.apk
          zip -q -d work.apk 'META-INF/*' 'assets/public/*'
          cd stage && zip -q -r ../work.apk assets && cd ..
          unzip -l work.apk | grep -E 'index.html|index-' | head -3

      - name: Ausrichten und signieren
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/zipalign -f -p 4 work.apk aligned.apk
          keytool -genkeypair -v -keystore ph.jks -storepass printhome -keypass printhome -alias printhome \
            -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Print Home KG, O=Print Home KG, C=AT"
          $BT/apksigner sign --ks ph.jks --ks-pass pass:printhome --key-pass pass:printhome --out PrintHome-${{ needs.publish.outputs.version }}.apk aligned.apk
          $BT/apksigner verify --print-certs PrintHome-${{ needs.publish.outputs.version }}.apk | head -3

      - name: APK am Release anhängen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ needs.publish.outputs.version }}
          files: PrintHome-${{ needs.publish.outputs.version }}.apk
